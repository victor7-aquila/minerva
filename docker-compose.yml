# 로컬 개발용 인프라. 앱 프로세스는 각 앱 폴더에서 따로 띄운다
services:
  mongo:
    image: mongo:8
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db

  # RAG Server의 벡터 저장소. REST(6333)만 연다
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - '127.0.0.1:6333:6333'
    volumes:
      - qdrant-data:/qdrant/storage

  # RAG Server의 LLM·VLM 실행기. 모델은 자동으로 받지 않는다
  # ★ 모델은 직접 받는다: docker compose exec ollama ollama pull qwen3:14b (이미지 캡션용은 qwen3-vl:8b)
  ollama:
    image: ollama/ollama:0.40.2
    ports:
      - '127.0.0.1:11434:11434'
    volumes:
      - ollama-models:/root/.ollama

volumes:
  mongo-data:
  qdrant-data:
  ollama-models:
