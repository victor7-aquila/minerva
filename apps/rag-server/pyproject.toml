[project]
name = "minerva-rag"
version = "0.0.0"
description = "minerva RAG Server"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.143",
    "httpx>=0.28.1",
    "ollama>=0.6.3",
    "pydantic>=2.14",
    "pydantic-settings>=2.15",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.1",
    "sentence-transformers>=6.1.0",
    "starlette>=1.7",
    "structlog>=26.1",
    "torch>=2.14.1",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40",
    "deptry>=0.25",
    "import-linter>=2.15",
    "pytest>=9.1",
    "ruff>=0.16",
]

[build-system]
requires = ["uv_build>=0.9"]
build-backend = "uv_build"

# ── 패키지 소스 ────────────────────────────────────────────

# ★ torch는 CPU 휠 인덱스에서만 받는다. PyPI torch는 Linux에서 nvidia-*·triton을 끌어오며
#   그 라이선스는 승인 밖이다. sources는 직접 의존성에만 적용되므로 torch를 직접 선언한다
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.uv]
# ★ portalocker가 Windows에서 끌어오는 pywin32는 LGPL-2.1 등을 번들해 허용 라이선스 밖이라
#   사용자 결정으로 뺀다. qdrant-client의 로컬 디스크 모드에서만 쓰이고 이 앱은 쓰지 않는다
exclude-dependencies = ["pywin32"]

# ── 정적 검사 ──────────────────────────────────────────────

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# ★ 명세 문서(MODULE.md 등)의 코드 블록은 고치지 않는다
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N"]

# ★ `import minerva_rag.x as y` 형태를 캐시 상태에 따라 서드파티로 보는 일이 있어 자기 패키지를 명시한다
[tool.ruff.lint.isort]
known-first-party = ["minerva_rag"]

# ★ mypy는 pathspec(MPL-2.0)을 끌어와 허용 라이선스 밖이라 basedpyright를 쓴다
[tool.basedpyright]
pythonVersion = "3.12"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingParameterType = "error"
reportUnnecessaryTypeIgnoreComment = "error"

# ★ torch는 CPU 인덱스 고정용으로만 직접 선언한다. 코드에서 import하지 않는다
[tool.deptry]
# ★ 단위가 서로의 공개 표면을 절대 경로(minerva_rag.core)로 import하므로 자기 패키지로 알려 준다
known_first_party = ["minerva_rag"]

[tool.deptry.per_rule_ignores]
# ★ uvicorn은 실행 명령(uvicorn minerva_rag.api:create_app --factory)에서만 쓰고 코드에서 import하지 않는다
# ★ python-multipart는 FastAPI가 multipart를 해석할 때 내부에서 import한다
DEP002 = ["torch", "uvicorn", "python-multipart"]

# ★ 의존 규칙의 정본은 ARCHITECT.md 「의존 규칙」이다. 규칙을 바꿀 때는 그 문서부터 바꾼다
[tool.importlinter]
root_package = "minerva_rag"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "계층: api → service → evaluation → chunking·indexing·search → resource → core"
type = "layers"
layers = [
    "minerva_rag.api",
    "minerva_rag.service",
    "minerva_rag.evaluation",
    "minerva_rag.chunking | minerva_rag.indexing | minerva_rag.search",
    "minerva_rag.resource",
    "minerva_rag.core",
]

[[tool.importlinter.contracts]]
name = "api는 service와 core만 쓴다"
type = "forbidden"
# ★ api → service → 기능 단위처럼 허용된 경로를 거친 간접 import는 막지 않는다. 직접 import만 막는다
allow_indirect_imports = true
source_modules = ["minerva_rag.api"]
forbidden_modules = [
    "minerva_rag.chunking",
    "minerva_rag.indexing",
    "minerva_rag.search",
    "minerva_rag.evaluation",
    "minerva_rag.resource",
]

[[tool.importlinter.contracts]]
name = "evaluation은 search와 core만 쓴다"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["minerva_rag.evaluation"]
forbidden_modules = [
    "minerva_rag.chunking",
    "minerva_rag.indexing",
    "minerva_rag.resource",
]

[[tool.importlinter.contracts]]
name = "Qdrant와 모델(Ollama·sentence-transformers)에는 resource만 접근한다"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "minerva_rag.api",
    "minerva_rag.service",
    "minerva_rag.chunking",
    "minerva_rag.indexing",
    "minerva_rag.search",
    "minerva_rag.evaluation",
    "minerva_rag.core",
]
forbidden_modules = ["qdrant_client", "ollama", "sentence_transformers"]

# 근거: ARCHITECT.md 「의존 규칙」 "Backend로 보내는 HTTP 호출은 service의 작업 상태 알림만 한다"
#   ★ resource는 Ollama 클라이언트 설정에 httpx를 쓰므로 출발지에서 뺀다
[[tool.importlinter.contracts]]
name = "Backend로 보내는 HTTP 호출(httpx)은 service의 작업 상태 알림(jobs)만 한다 (ARCHITECT.md 「의존 규칙」)"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "minerva_rag.api",
    "minerva_rag.chunking",
    "minerva_rag.indexing",
    "minerva_rag.search",
    "minerva_rag.evaluation",
    "minerva_rag.core",
    "minerva_rag.service._guard",
    "minerva_rag.service.captioner",
    "minerva_rag.service.lifecycle_service",
    "minerva_rag.service.caption_service",
    "minerva_rag.service.index_service",
    "minerva_rag.service.search_service",
    "minerva_rag.service.delete_service",
    "minerva_rag.service.metadata_service",
    "minerva_rag.service.evaluation_service",
]
forbidden_modules = ["httpx"]

# 근거: ARCHITECT.md 「의존 규칙」 "service가 resource에 직접 기대는 것은 조립, 기동·종료,
#   상태 확인, 표 요약·이미지 캡션 생성뿐이다" (조립·기동·종료·상태 확인은 lifecycle_service, 생성은 captioner)
[[tool.importlinter.contracts]]
name = "service가 resource를 직접 쓰는 것은 조립·기동·종료·상태 확인(lifecycle_service)과 요약·캡션 생성(captioner)뿐이다 (ARCHITECT.md 「의존 규칙」)"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "minerva_rag.service._guard",
    "minerva_rag.service.jobs",
    "minerva_rag.service.caption_service",
    "minerva_rag.service.index_service",
    "minerva_rag.service.search_service",
    "minerva_rag.service.delete_service",
    "minerva_rag.service.metadata_service",
    "minerva_rag.service.evaluation_service",
]
forbidden_modules = ["minerva_rag.resource"]

# 근거: ARCHITECT.md 「폴더 구조와 배치 규칙」(작업 관리는 서비스 파일들이 쓰는 헬퍼)과
#   service MODULE.md 「작업 관리 헬퍼」 "작업 큐 — 금지: chunking·indexing과 서비스 파일을 import하지 않는다"
[[tool.importlinter.contracts]]
name = "작업 큐(jobs)는 기능 단위와 서비스 파일을 import하지 않는다 (service MODULE.md 「작업 관리 헬퍼」)"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["minerva_rag.service.jobs"]
forbidden_modules = [
    "minerva_rag.chunking",
    "minerva_rag.indexing",
    "minerva_rag.search",
    "minerva_rag.evaluation",
    "minerva_rag.resource",
    "minerva_rag.service.captioner",
    "minerva_rag.service.lifecycle_service",
    "minerva_rag.service.caption_service",
    "minerva_rag.service.index_service",
    "minerva_rag.service.search_service",
    "minerva_rag.service.delete_service",
    "minerva_rag.service.metadata_service",
    "minerva_rag.service.evaluation_service",
]

# ★ 아래 금지 의존은 모듈 import로 표현할 수 없어 계약으로 두지 않는다 — 리뷰와 테스트로 본다
# - 청크 저장·삭제는 indexing만 resource로 하고, search는 조회만 한다

# ── 테스트 ────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = ["req(id): 테스트가 검증하는 REQ ID (예: REQ-RAG-4.1.1)"]
